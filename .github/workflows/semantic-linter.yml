name: Semantic linter (advisory)

# Advisory-only: surfaces PR changes that contradict a documented invariant.
# NEVER fails the build — reports findings as annotations + a job summary.

on:
  # Run the base repository's trusted workflow definition. The job checks out
  # only the event base SHA; the untrusted head is fetched solely as diff data.
  pull_request_target:
    types: [opened, synchronize, reopened]

# Keep only the latest run per PR.
concurrency:
  group: semantic-linter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  # Lets the built-in GITHUB_TOKEN call GitHub Copilot (api.githubcopilot.com)
  # as the zero-secret default judge. The token authenticates directly as a
  # Bearer credential (no separate Copilot token exchange needed); see
  # https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli-in-actions
  # for the workflow permission semantics. Harmless when a dedicated
  # LORE_WORKER_API_KEY is configured (that path ignores the token).
  copilot-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    # gpt-5.6-luna is the default judge (PR #1493 cross-model validation:
    # 6/6 control PRs clean, 0 unparseable). Reachable via GitHub Copilot's
    # /responses endpoint (NOT /chat/completions — see worker-model.ts and
    # PR #1582's `openai-responses` worker adapter, gated by
    # `isResponsesOnlyModel` in llm-adapter.ts).
    # Warm cache ~2-4 min; cold start with a fresh GITHUB_TOKEN + Copilot
    # quota lookup can take ~10-15 min on a PR with many hunks and many
    # invariants. 25 min gives ~10 min of headroom for cold-start variation,
    # matching the empirical cap the previous free-tier zero-secret path hit
    # (PR #1412 / PR #1501).
    timeout-minutes: 25
    # Advisory: a failure here must never block a PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          # Execute only code and read invariants from the trusted base commit.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Fetch exact PR head for diffing
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          sha_re='^[0-9a-fA-F]{40}$'
          [[ "$PR_BASE_SHA" =~ $sha_re ]] || { echo "invalid PR base SHA" >&2; exit 1; }
          [[ "$PR_HEAD_SHA" =~ $sha_re ]] || { echo "invalid PR head SHA" >&2; exit 1; }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "invalid PR number" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$PR_BASE_SHA"
          git fetch --no-tags --depth=1 origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/lore-pr-head"
          test "$(git rev-parse refs/remotes/origin/lore-pr-head)" = "$PR_HEAD_SHA"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      # Build the CLI bundle. The CLI cannot run from source via tsx — its entry
      # (instrument.ts, lib/upgrade.ts, etc.) uses esbuild/Bun CJS `require()`
      # that throws under tsx's ESM. `bundle` esbuild-inlines @loreai/core + the
      # gateway into a single CJS binary (dist/bin.cjs) that runs under plain
      # Node with instrumentation intact — no separate core build needed.
      - run: pnpm --filter @loreai/gateway run bundle
      - name: Run Lore semantic linter
        uses: ./.github/actions/lint
        with:
          # Diff the event's immutable SHAs; the worktree remains at base SHA.
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          # Run the built CJS binary under Node (see the build step above).
          lore-command: "node packages/gateway/dist/bin.cjs"
          # Judge model + credential. Two supported setups:
          #  1. Zero-secret (default): GitHub Copilot via the built-in
          #     GITHUB_TOKEN + `copilot-requests: write` above. Uses
          #     github-copilot/gpt-5.6-luna as the default judge — best
          #     cost/quality point across the OpenAI model family on this
          #     task (measured on the 6-PR control corpus in PR #1493; 0
          #     false positives, 0 unparseable). The token is sent as a Bearer
          #     credential to api.githubcopilot.com/responses (the openai-
          #     responses worker adapter routes gpt-5.6-* via this endpoint
          #     — see PR #1582 / `isResponsesOnlyModel` in llm-adapter.ts);
          #     no Copilot-specific token exchange needed in CI.
          #     On fork PRs the token is read-only and may lack inference
          #     quota; the judge then produces a visible inconclusive health
          #     report. Advisory mode remains non-blocking; gate mode fails closed.
          #  2. Dedicated key (busy repos): set the LORE_WORKER_API_KEY secret.
          #     It takes precedence, and the judge model is whatever you set in
          #     the `LORE_INVARIANT_MODEL` repo variable (e.g.
          #     anthropic/claude-haiku-4.5); if that variable is unset the CLI
          #     falls back to the repo's configured default worker model.
          #
          # Model precedence (independent of the credential):
          #   - `LORE_INVARIANT_MODEL` var set     → use it (either credential).
          #   - else no dedicated key              → github-copilot/gpt-5.6-luna
          #     (the token is a GitHub token; a github-copilot id is required so
          #     the CLI sends it as Bearer to api.githubcopilot.com/responses).
          #   - else (dedicated key, no var)       → empty → CLI's configured
          #     default worker model, authed with the dedicated key.
          # This avoids the trap of pairing a dedicated (e.g. Anthropic) key with
          # a forced github-copilot id, which would 401 and silently no-op.
          model: ${{ vars.LORE_INVARIANT_MODEL != '' && vars.LORE_INVARIANT_MODEL || (secrets.LORE_WORKER_API_KEY == '' && 'github-copilot/gpt-5.6-luna' || '') }}
          worker-api-key: ${{ secrets.LORE_WORKER_API_KEY != '' && secrets.LORE_WORKER_API_KEY || github.token }}
          # Reserve five minutes of the 25-minute job for report publication and
          # bounded gateway shutdown.
          deadline-seconds: "1200"
          candidate-timeout-seconds: "90"
