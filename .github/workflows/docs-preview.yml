name: Docs Preview

# PR-preview deploys and cleanup only. Production deploys to GitHub Pages
# live in docs-deploy.yml (push: main) — kept separate so a merge's
# simultaneous `push: main` and `pull_request: closed` triggers never race
# and cancel each other.

on:
  workflow_dispatch:
  pull_request:
    # No paths filter on pull_request: the 'closed' event must always fire
    # so the preview action can clean up deployed previews. A paths-filter
    # step inside the job skips deploy for non-docs PRs.
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Check if website files changed. On 'closed' events we always proceed
      # (cleanup). Otherwise we only install/build/deploy when website files
      # changed — non-website PRs skip the whole install + build.
      - name: Check for website changes
        id: filter
        if: github.event.action != 'closed'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            website:
              - 'packages/website/**'
              - '.github/workflows/docs-preview.yml'

      # One place decides whether the expensive path runs. This also gates the
      # toolchain setup below: setup-node's pnpm cache fails its post-job save
      # when no install ever ran, which failed the whole job on every
      # non-website PR.
      - name: Decide whether to build
        id: gate
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          WEBSITE_CHANGED: ${{ steps.filter.outputs.website }}
        run: |
          if [[ "$HEAD_REPO" == "$THIS_REPO" ]] &&
             { [[ "$ACTION" == "closed" ]] || [[ "$WEBSITE_CHANGED" == "true" ]]; }; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build website
        if: steps.gate.outputs.run == 'true'
        run: pnpm --filter '@loreai/website' build
        env:
          PR_NUMBER: ${{ github.event.number }}

      - name: Deploy PR Preview
        if: steps.gate.outputs.run == 'true'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: packages/website/dist/
          preview-branch: gh-pages
          umbrella-dir: _preview
          pages-base-url: withlore.ai
          action: auto
